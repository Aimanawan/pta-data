name: PTA Scraper
on:
  push:
    branches: [main]
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Libraries install
        run: pip install selenium
      - name: Run scraper
        run: python PTA_test1.py
