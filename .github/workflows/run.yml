name: PTA Scraper
on:
  push:
    branches: [main]
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        
      - name: Libraries install
        run: pip install selenium pytest webdriver-manager
        
      - name: Run scraper
        run: pytest PTA_test1.py -v -s
