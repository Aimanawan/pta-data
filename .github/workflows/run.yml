name: PTA Scraper
on:
  push:
    branches: [main]
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        
      - name: Libraries install
        run: pip install selenium pytest webdriver-manager pytest-html
        
      - name: Run tests
        run: pytest test_test2.py -v -s --html=report.html --self-contained-html
        
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html
